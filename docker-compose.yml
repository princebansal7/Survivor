# Database only (for running backend/frontend natively):
#   docker compose up -d
#
# Full stack (DB + backend + frontend):
#   docker compose --profile full up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: survivor_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: survivor_db
    ports:
      - "5432:5432"
    volumes:
      - survivor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survivor_user -d survivor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["full"]
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://survivor_user:password@db:5432/survivor_db
      SECRET_KEY: docker-secret-key-change-in-production-must-be-32-chars
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    profiles: ["full"]
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  survivor_postgres_data:
